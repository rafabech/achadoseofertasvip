  <style>
    :root {
      --verde: #23c653;
      --verde-escuro: #07993a;
      --branco: #ffffff;
      --texto: #10213d;
      --fundo: #f5f3ed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--fundo);
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }

    .pagina {
      width: 100%;
      min-height: 100vh;
      padding-bottom: 86px;
      background: var(--fundo);
    }

    .imagem-link {
      display: block;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      text-decoration: none;
      line-height: 0;
    }

    .imagem-principal {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .botao-fixo {
      position: fixed;
      left: 50%;
      bottom: max(
        12px,
        env(safe-area-inset-bottom)
      );

      transform: translateX(-50%);
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: min(
        calc(100% - 24px),
        620px
      );

      min-height: 62px;
      padding: 13px 18px;

      border: 2px solid rgba(255, 255, 255, 0.95);
      border-radius: 18px;

      background:
        linear-gradient(
          180deg,
          var(--verde),
          var(--verde-escuro)
        );

      color: var(--branco);
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;

      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.28);

      transition:
        transform 0.15s ease,
        filter 0.15s ease;
    }

    .botao-fixo:hover {
      filter: brightness(1.05);
    }

    .botao-fixo:active {
      transform:
        translateX(-50%)
        scale(0.985);
    }

    .texto-oculto {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    footer {
      padding: 20px 15px 105px;
      text-align: center;
      color: #747b88;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .pagina {
        padding-bottom: 78px;
      }

      .botao-fixo {
        min-height: 58px;
        border-radius: 16px;
        font-size: 16px;
        padding: 12px 14px;
      }

      footer {
        padding-bottom: 95px;
      }
    }

    @media (min-width: 1601px) {
      body {
        background: #eeece5;
      }

      .imagem-link {
        box-shadow:
          0 0 60px rgba(0, 0, 0, 0.08);
      }
    }
  </style>

<body>

  <main class="pagina">

    <h1 class="texto-oculto">

      achadinhos de casa, decoração, esportes, moda,

      href="https://chat.whatsapp.com/GSif4RS3CgMJ9IP0wg4pVz"

      rel="noopener noreferrer"
      aria-label="Entrar grátis no grupo Achados e Ofertas VIP no WhatsApp"
    >

      <img
        class="imagem-principal"
        src="/fundo-site.png"
        alt="Achados e Ofertas VIP com promoções de casa, decoração, esportes, Mercado Livre, Shopee, Amazon e Magalu"
        width="1536"
        height="1024"
        loading="eager"
        fetchpriority="high"
      >

    </a>

  <footer>
    © 2026 Achados e Ofertas VIP<br>
    As ofertas podem mudar ou acabar sem aviso.
    O site pode conter links de afiliados.
  </footer>

  <a
    class="botao-fixo js-whatsapp"
    href="https://chat.whatsapp.com/GSif4RS3CgMJ9IP0wg4pVz"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Entrar grátis no grupo Achados e Ofertas VIP"
  >
    💬 ENTRAR GRÁTIS NO GRUPO
  </a>

  <script>
    const linkWhatsApp =
      "https://chat.whatsapp.com/GSif4RS3CgMJ9IP0wg4pVz";

    function registrarCliqueWhatsApp() {
      try {
        localStorage.setItem(
          "ultimo_clique_whatsapp",
          new Date().toISOString()
        );
      } catch (erro) {}

      if (
        typeof window.gtag === "function"
      ) {
        window.gtag(
          "event",
          "click_whatsapp",
          {
            event_category: "conversao",
            event_label: "grupo_achados_ofertas"
          }
        );
      }

      if (
        typeof window.fbq === "function"
      ) {
        window.fbq(
          "trackCustom",
          "ClickWhatsAppGroup"
        );
      }
    }

    document
      .querySelectorAll(".js-whatsapp")
      .forEach(function (link) {

        link.addEventListener(
          "click",
          function () {
            registrarCliqueWhatsApp();
          }
        );

      });

    window.addEventListener(
      "load",
      function () {

        setTimeout(
          function () {
            registrarCliqueWhatsApp();

            window.location.href =
              linkWhatsApp;
          },
          4000
        );

      }
    );
  </script>
